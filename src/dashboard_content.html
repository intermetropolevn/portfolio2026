<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Control Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --indigo: #6366f1;
    --indigo-glow: rgba(99,102,241,0.35);
    --violet: #8b5cf6;
    --violet-glow: rgba(139,92,246,0.3);
    --neon: #39ff8e;
    --neon-glow: rgba(57,255,142,0.25);
    --red: #f43f5e;
    --amber: #f59e0b;
    --bg: #080a10;
    --bg2: #0d1117;
    --panel: rgba(13,17,26,0.85);
    --border: rgba(99,102,241,0.18);
    --border-bright: rgba(99,102,241,0.5);
    --text: #e2e8f0;
    --muted: #64748b;
    --glass: rgba(255,255,255,0.03);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Playfair Display', serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* ── NOISE OVERLAY ── */
  .noise-overlay {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  /* ── GLOW ORBS ── */
  .orb {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(90px); opacity: 0.12;
  }
  .orb-1 { width: 600px; height: 600px; background: var(--indigo); top: -200px; left: -100px; }
  .orb-2 { width: 400px; height: 400px; background: var(--violet); bottom: -100px; right: -100px; }
  .orb-3 { width: 300px; height: 300px; background: var(--neon); top: 40%; left: 40%; opacity: 0.06; }

  /* ── GLASS PANEL ── */
  .glass {
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  /* ── HEADER ── */
  #header {
    height: 52px; min-height: 52px;
    display: flex; align-items: center;
    padding: 0 16px; gap: 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,10,16,0.95);
    backdrop-filter: blur(20px);
    z-index: 100; position: relative;
  }
  .logo-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Mono', monospace; font-size: 10px; color: #fff;
    box-shadow: 0 0 16px var(--indigo-glow);
    flex-shrink: 0;
  }
  .logo-text { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--text); }
  .logo-sub { font-size: 9px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 0.08em; }
  .h-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--glass); color: var(--text);
    font-family: 'Playfair Display', serif; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--indigo); background: rgba(99,102,241,0.08); color: #fff; }
  .btn-primary { background: linear-gradient(135deg, var(--indigo), var(--violet)); border: none; color: #fff; }
  .btn-primary:hover { box-shadow: 0 0 20px var(--indigo-glow); filter: brightness(1.1); }
  .btn-neon { border-color: var(--neon); color: var(--neon); }
  .btn-neon:hover { background: rgba(57,255,142,0.08); box-shadow: 0 0 16px var(--neon-glow); }

  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-active { background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: pulse-dot 2s infinite; }
  .status-warn { background: var(--amber); }
  .status-error { background: var(--red); }
  @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.6;transform:scale(0.85)} }

  .sys-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--glass);
    font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted);
  }
  .sys-chip span { color: var(--text); }

  /* ── MAIN LAYOUT ── */
  #main { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  /* ── LEFT SIDEBAR ── */
  #sidebar {
    width: 56px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: rgba(8,10,16,0.97);
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 4px;
    z-index: 50;
  }
  .sb-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s; color: var(--muted);
    position: relative;
  }
  .sb-icon:hover, .sb-icon.active { background: rgba(99,102,241,0.12); color: var(--indigo); }
  .sb-icon.active::before {
    content: ''; position: absolute; left: -1px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; background: var(--indigo); border-radius: 0 3px 3px 0;
    box-shadow: 2px 0 8px var(--indigo-glow);
  }
  .sb-sep { width: 24px; height: 1px; background: var(--border); margin: 4px 0; }

  /* ── PROJECT TABS ── */
  #proj-bar {
    height: 36px; min-height: 36px;
    display: flex; align-items: center; gap: 2px; padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(8,10,16,0.9);
  }
  .proj-tab {
    padding: 5px 14px; border-radius: 6px 6px 0 0; cursor: pointer;
    font-size: 11px; font-weight: 600; color: var(--muted); transition: all 0.2s;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .proj-tab:hover { color: var(--text); }
  .proj-tab.active { color: var(--indigo); border-bottom-color: var(--indigo); background: rgba(99,102,241,0.07); }
  .proj-new {
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); border: 1px dashed var(--border); font-size: 14px;
    transition: all 0.2s; margin-left: 4px;
  }
  .proj-new:hover { border-color: var(--indigo); color: var(--indigo); }

  /* ── CENTER CANVAS ── */
  #canvas-wrap {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  #canvas {
    flex: 1; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,92,246,0.04) 0%, transparent 60%);
  }
  /* grid dots */
  #canvas::before {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(99,102,241,0.2) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* ── SVG EDGES ── */
  #edge-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; width: 100%; height: 100%; }

  /* ── SYSTEM MAP LAYER ── */
  @keyframes floatPulse {
    0% { transform: translate(-50%, -50%); filter: drop-shadow(0 0 10px transparent); }
    50% { transform: translate(-50%, calc(-50% - 15px)); filter: drop-shadow(0 0 20px rgba(99,102,241,0.2)); }
    100% { transform: translate(-50%, -50%); filter: drop-shadow(0 0 10px transparent); }
  }

  #system-map-layer {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    max-width: 1200px;
    width: 80%;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: floatPulse 14s ease-in-out infinite;
  }
  #system-map-layer img {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  /* ── NODE ── */
  .node {
    position: absolute; width: 190px;
    border-radius: 16px; cursor: grab;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.15s;
    z-index: 2; user-select: none;
    overflow: visible;
  }
  .node:hover { border-color: var(--border-bright); z-index: 20; }
  .node.selected { border-color: var(--indigo); box-shadow: 0 0 0 2px var(--indigo-glow), 0 16px 48px rgba(0,0,0,0.5); z-index: 30; }
  .node.dragging { cursor: grabbing; transform: scale(1.03); box-shadow: 0 24px 64px rgba(0,0,0,0.7); z-index: 50; }
  .node-header {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px 9px; border-bottom: 1px solid var(--border);
  }
  .node-icon {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .node-title { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; flex: 1; }
  .node-badge {
    font-size: 8px; font-family: 'Space Mono', monospace;
    padding: 2px 6px; border-radius: 20px; font-weight: 700; letter-spacing: 0.06em;
  }
  .node-body { padding: 10px 14px 12px; }
  .node-desc { font-size: 10px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }

  /* sparkline */
  .sparkline { height: 28px; width: 100%; position: relative; }
  .sparkline svg { width: 100%; height: 100%; }

  /* metrics (shown on hover) */
  .node-metrics {
    display: none; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .node:hover .node-metrics { display: flex; }
  .metric-pill {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 20px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    font-size: 9px; font-family: 'Space Mono', monospace; color: var(--muted);
  }
  .metric-pill .val { color: var(--text); font-weight: 700; }

  /* ports */
  .port {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg2); border: 2px solid var(--border-bright);
    cursor: crosshair; transition: all 0.2s; z-index: 15;
  }
  .port:hover { transform: scale(1.4); background: var(--indigo); box-shadow: 0 0 8px var(--indigo-glow); }
  .port-in { left: -5px; top: 50%; transform: translateY(-50%); }
  .port-out { right: -5px; top: 50%; transform: translateY(-50%); }
  .port-in:hover { transform: translateY(-50%) scale(1.4); }
  .port-out:hover { transform: translateY(-50%) scale(1.4); }

  /* node type colors */
  .n-input .node-icon { background: rgba(99,102,241,0.15); color: var(--indigo); }
  .n-input .node-badge { background: rgba(99,102,241,0.15); color: var(--indigo); }
  .n-input:hover { box-shadow: 0 0 32px rgba(99,102,241,0.12); }

  .n-constraint .node-icon { background: rgba(245,158,11,0.15); color: var(--amber); }
  .n-constraint .node-badge { background: rgba(245,158,11,0.15); color: var(--amber); }
  .n-constraint:hover { box-shadow: 0 0 32px rgba(245,158,11,0.1); }

  .n-execution .node-icon { background: rgba(57,255,142,0.12); color: var(--neon); }
  .n-execution .node-badge { background: rgba(57,255,142,0.12); color: var(--neon); }
  .n-execution:hover { box-shadow: 0 0 32px rgba(57,255,142,0.1); }

  .n-feedback .node-icon { background: rgba(139,92,246,0.15); color: var(--violet); }
  .n-feedback .node-badge { background: rgba(139,92,246,0.15); color: var(--violet); }
  .n-feedback:hover { box-shadow: 0 0 32px rgba(139,92,246,0.12); }

  .n-optimization .node-icon { background: rgba(244,63,94,0.12); color: var(--red); }
  .n-optimization .node-badge { background: rgba(244,63,94,0.12); color: var(--red); }
  .n-optimization:hover { box-shadow: 0 0 32px rgba(244,63,94,0.1); }

  .n-api .node-icon { background: rgba(6,182,212,0.12); color: #06b6d4; }
  .n-api .node-badge { background: rgba(6,182,212,0.12); color: #06b6d4; }

  /* ── FLOATING TOOLBAR ── */
  #float-toolbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px; border-radius: 16px;
    border: 1px solid var(--border);
    background: rgba(8,10,16,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 3; box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  #float-toolbar:hover {
    background: rgba(8,10,16,0.8);
    box-shadow: 0 6px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
    transform: translateX(-50%) translateY(-2px);
  }
  .ft-btn {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: all 0.2s; font-size: 15px;
    border: 1px solid transparent;
  }
  .ft-btn:hover { background: rgba(99,102,241,0.1); color: var(--text); border-color: var(--border); }
  .ft-btn.active { background: rgba(99,102,241,0.15); color: var(--indigo); border-color: var(--indigo); }
  .ft-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; }

  /* ── RIGHT INSPECTOR ── */
  #inspector {
    width: 0; flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: rgba(8,10,16,0.97);
    overflow: hidden; transition: width 0.3s ease;
    z-index: 50; display: flex; flex-direction: column;
  }
  #inspector.open { width: 270px; }
  #insp-inner { width: 270px; height: 100%; overflow-y: auto; padding: 0; }

  .insp-header {
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .insp-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--text); }
  .insp-close { color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; transition: color 0.2s; }
  .insp-close:hover { color: var(--text); }

  .insp-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .insp-section-title { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }

  .insp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .insp-label { font-size: 10px; color: var(--muted); }
  .insp-val { font-size: 10px; font-family: 'Space Mono', monospace; color: var(--text); }
  .insp-val.good { color: var(--neon); }
  .insp-val.warn { color: var(--amber); }
  .insp-val.bad { color: var(--red); }

  .insp-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-top: 2px; }
  .insp-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .toggle-label { font-size: 10px; color: var(--muted); }
  .toggle {
    width: 30px; height: 16px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,0.08); position: relative; transition: background 0.2s;
    border: 1px solid var(--border);
  }
  .toggle.on { background: var(--indigo); border-color: var(--indigo); }
  .toggle-knob {
    position: absolute; width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); top: 2px; left: 2px; transition: all 0.2s;
  }
  .toggle.on .toggle-knob { left: 16px; background: #fff; }

  .insp-chart { height: 60px; width: 100%; margin-top: 4px; }

  /* ── SIMULATION ANIMATION ── */
  @keyframes flow-dash {
    to { stroke-dashoffset: -20; }
  }
  .edge-animated {
    stroke-dasharray: 6 4;
    animation: flow-dash 0.6s linear infinite;
  }
  @keyframes node-pulse {
    0%,100% { box-shadow: 0 0 0 0 var(--indigo-glow); }
    50% { box-shadow: 0 0 0 8px transparent; }
  }
  .simulating .node { animation: node-pulse 1.5s infinite; }

  /* ── MINI MAP ── */
  #minimap {
    position: absolute; bottom: 72px; right: 16px;
    width: 120px; height: 80px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(8,10,16,0.85);
    backdrop-filter: blur(10px); z-index: 60; overflow: hidden;
    opacity: 0.7;
  }
  .mini-node { position: absolute; border-radius: 3px; opacity: 0.7; }

  /* ── TOOLTIP ── */
  .tooltip {
    position: fixed; z-index: 1000; pointer-events: none;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(13,17,26,0.95); border: 1px solid var(--border);
    font-size: 10px; font-family: 'Space Mono', monospace; color: var(--text);
    backdrop-filter: blur(12px); white-space: nowrap;
    opacity: 0; transition: opacity 0.15s;
  }
  .tooltip.show { opacity: 1; }

  /* ── SIMULATION PARTICLE ── */
  .particle {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--neon); box-shadow: 0 0 10px var(--neon);
    pointer-events: none; z-index: 5; transition: none;
  }

  /* ── NOTIFICATIONS ── */
  #notif-stack {
    position: absolute; top: 60px; right: 16px; z-index: 200;
    display: flex; flex-direction: column; gap: 6px;
    width: 240px;
  }
  .notif {
    padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(13,17,26,0.95); backdrop-filter: blur(16px);
    font-size: 11px; display: flex; gap: 8px; align-items: flex-start;
    animation: notif-in 0.3s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  @keyframes notif-in { from { opacity:0; transform: translateX(20px) } to { opacity:1; transform: translateX(0) } }
  .notif-icon { font-size: 14px; flex-shrink: 0; line-height: 1.4; }
  .notif-text { line-height: 1.4; color: var(--text); }
  .notif-sub { font-size: 9px; color: var(--muted); margin-top: 2px; }

  /* layout assist */
  .ml-auto { margin-left: auto; }
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-2 { gap: 8px; }
  .gap-1 { gap: 4px; }

  /* ── SYSTEM MAP ANIMATIONS ── */
  @keyframes edgeFlow {
    to { stroke-dashoffset: -40; }
  }
  .edge-flow {
    stroke-dasharray: 10 8;
    animation: edgeFlow 1s linear infinite;
  }
  
  @keyframes signalPulse {
    0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 2px transparent); }
    50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
  }
  .signal {
    animation: signalPulse 2s ease-in-out infinite;
  }

  @keyframes corePulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4)) brightness(1); }
    50% { filter: drop-shadow(0 0 25px rgba(34, 211, 238, 0.8)) brightness(1.2); }
  }
  .node-core {
    animation: corePulse 3s ease-in-out infinite;
  }

  .node-bg {
    opacity: 0.6;
    transition: opacity 0.3s ease;
  }
  .node-bg:hover {
    opacity: 0.9;
  }

</style>

<div class="noise-overlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- HEADER -->
<header id="header">
  <div class="logo-mark">ACC</div>
  <div>
    <div class="logo-text">Agent Control Center</div>
    <div class="logo-sub">ORCHESTRATION LAYER v2.4.1</div>
  </div>
  <div class="h-sep"></div>

  <div class="sys-chip"><div class="status-dot status-active"></div>SYSTEM <span>NOMINAL</span></div>
  <div class="sys-chip">AGENTS <span id="agent-count">12</span></div>
  <div class="sys-chip">LATENCY <span id="latency-val">34ms</span></div>

  <div class="h-sep"></div>
  <button class="btn" id="btn-auto-layout">⚡ Auto-Layout</button>
  <button class="btn btn-neon" id="sim-btn">▶ Simulate</button>

  <div class="ml-auto flex items-center gap-2">
    <div class="sys-chip">CPU <span id="cpu-val">42%</span></div>
    <div class="sys-chip">MEM <span id="mem-val">1.8 GB</span></div>
    <button class="btn btn-primary">+ New Agent</button>
  </div>
</header>
